<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp</title>
    <!-- <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css"> lädt alle bootstrap dateien, große Ladezeit -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <!-- bootstrap files > lädt nur bestimmte (benötigte) dateien, spart ladezeit -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body onload="init()">
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">QuizApp</span>
        </div>
    </nav>
    <div class="container">

        <div class="card quiz-card">

            <img src="img/quiz.jpg" class="card-img-top" id="header_img">

            <div class="card-body" id="endscreen" style="display: none;">
                <div class="text-center final_headline">Quiz beendet!</div>

                <div class="text-center">Du hast <b id="endscreen_right_answers">XXX</b> Fragen von <b id="endscreen_all_questions">XXX</b> richtig beantwortet.</div>
            </div>

            <div class="card-body" id="question_body">
                <h5 class="card-title" id="question_text"></h5>

                <div class="card quiz_answer_card mb-2" onclick="answer('answer_1')">
                    <div class="card-body" id="answer_1"></div>
                </div>
                <div class="card quiz_answer_card mb-2" onclick="answer('answer_2')">
                    <div class="card-body" id="answer_2"></div>
                </div>
                <div class="card quiz_answer_card mb-2" onclick="answer('answer_3')">
                    <div class="card-body" id="answer_3"></div>
                </div>
                <div class="card quiz_answer_card mb-2" onclick="answer('answer_4')">
                    <div class="card-body" id="answer_4"></div>
                </div>

                <div class="question-footer" id="question_footer">
                    <span><b id="current_question">1</b> von <b id="all_questions">5</b> Fragen</span>
                    <button class="btn btn-primary" id="next_button" onclick="nextQuestion()" disabled>Nächste Frage</button>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
